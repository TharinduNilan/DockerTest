name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      # 1. GitHub repository එකේ code එක ලබාගන්නවා
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Docker Hub එකට login වෙනවා
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # 3. Server image එක build කරලා push කරනවා
      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ (env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '') && format('{0}/my-app-server:latest', env.DOCKERHUB_USERNAME) || 'local/my-app-server:latest' }}

      # 4. Client image එක build කරලා push කරනවා
      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ (env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '') && format('{0}/my-app-client:latest', env.DOCKERHUB_USERNAME) || 'local/my-app-client:latest' }}