name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repository එකේ code එක ලබාගන්නවා
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Docker Hub එකට login වෙනවා
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Server image එක build කරලා push කරනවා
      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-app-server:latest

      # 4. Client image එක build කරලා push කරනවා
      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-app-client:latest